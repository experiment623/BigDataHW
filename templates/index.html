<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChiFraud 垃圾文本多模型对比系统</title>
    <style>
        :root {
            --bg: #f4f6f9; --card: #ffffff; --primary: #2563eb;
            --accent: #dc2626; --accent-green: #059669; --border: #e2e8f0;
            --text: #1e293b; --text-muted: #64748b; --success: #059669;
            --radius: 10px; --bar-bg: #e5e7eb;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg); color: var(--text); line-height: 1.6;
            height: 100vh; overflow: hidden;
        }

        .app-shell {
            display: flex; height: 100vh;
        }

        /* ========== 左侧面板 ========== */
        .left-panel {
            width: 420px; min-width: 420px; overflow-y: auto;
            padding: 28px 24px; border-right: 1px solid var(--border);
            background: var(--card); display: flex; flex-direction: column;
        }
        .left-panel h1 {
            font-size: 1.35rem; font-weight: 700; margin-bottom: 4px; text-align: center;
        }
        .left-panel .subtitle {
            font-size: 0.82rem; color: var(--text-muted); margin-bottom: 20px; text-align: center;
        }
        .form-group { margin-bottom: 18px; }
        .form-group label {
            display: block; font-size: 0.85rem; font-weight: 600;
            color: var(--text);
        }
        textarea {
            width: 100%; min-height: 120px; padding: 12px;
            border: 2px solid var(--border); border-radius: 8px;
            font-size: 0.9rem; font-family: inherit; resize: vertical;
            line-height: 1.7; transition: border-color 0.2s;
        }
        textarea:focus {
            outline: none; border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37,99,235,0.08);
        }

        /* 模型选择 */
        .model-list { display: flex; flex-direction: column; gap: 4px; }
        .model-item {
            display: flex; align-items: center; gap: 8px;
            padding: 7px 10px; border: 1px solid var(--border);
            border-radius: 6px; cursor: pointer; transition: all 0.12s;
            font-size: 0.84rem; user-select: none;
        }
        .model-item:hover { border-color: var(--primary); background: #f8faff; }
        .model-item.selected { border-color: var(--primary); background: #eff6ff; }
        .model-item.hero-item { border-width: 2px; font-weight: 600; }
        .model-item.hero-item.selected { border-color: var(--accent); background: #fef2f2; }
        .model-item input[type="checkbox"] {
            width: 16px; height: 16px; accent-color: var(--primary); cursor: pointer; flex-shrink: 0;
        }
        .model-item label { cursor: pointer; flex: 1; }
        .star-badge {
            font-size: 0.68rem; background: var(--accent); color: #fff;
            padding: 1px 6px; border-radius: 3px; font-weight: 700; flex-shrink: 0;
        }
        .quick-actions { display: flex; gap: 8px; margin-bottom: 8px; width: 100%; }
        .btn-sm {
            flex: 1; font-size: 0.78rem; padding: 4px 12px; border: 1px solid var(--border);
            border-radius: 5px; background: #fff; cursor: pointer; transition: all 0.12s;
            text-align: center;
        }
        .btn-sm:hover { background: #f1f5f9; }

        .btn-primary {
            width: 100%; padding: 12px; background: var(--primary); color: #fff;
            border: none; border-radius: 8px; font-size: 0.95rem; font-weight: 600;
            cursor: pointer; transition: all 0.2s; margin-top: 4px;
        }
        .btn-primary:hover { background: #1d4ed8; }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

        #loading-bar {
            text-align: center; padding: 10px; font-size: 0.82rem;
            color: var(--text-muted); display: none;
        }
        #loading-bar.visible { display: block; }
        .spinner {
            display: inline-block; width: 13px; height: 13px;
            border: 2px solid var(--border); border-top: 2px solid var(--primary);
            border-radius: 50%; animation: spin 0.8s linear infinite;
            margin-right: 5px; vertical-align: text-bottom;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ========== 右侧面板 ========== */
        .right-panel {
            flex: 1; overflow-y: auto; padding: 28px 32px;
            display: flex; flex-direction: column; gap: 20px;
        }
        .right-empty {
            flex: 1; display: flex; align-items: center; justify-content: center;
            color: var(--text-muted); font-size: 1rem;
        }
        .error-box {
            background: #fef2f2; border: 1px solid #fecaca; border-radius: var(--radius);
            padding: 14px 18px; color: #b91c1c; font-size: 0.88rem;
        }

        /* 结果统计条 */
        .result-summary {
            font-size: 0.95rem; font-weight: 600; color: var(--text);
            display: flex; justify-content: space-between; align-items: center;
        }
        .result-summary span { color: var(--text-muted); font-weight: 400; font-size: 0.85rem; }

        /* ========== ensemble_cross 英雄卡片 ========== */
        .hero-card {
            border-radius: var(--radius); overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .hero-card.hero-red {
            border: 2px solid var(--accent);
            background: linear-gradient(135deg, #fef2f2 0%, #fff 100%);
        }
        .hero-card.hero-green {
            border: 2px solid var(--accent-green);
            background: linear-gradient(135deg, #ecfdf5 0%, #fff 100%);
        }
        .hero-card .hero-header {
            padding: 12px 20px; display: flex;
            justify-content: space-between; align-items: center;
        }
        .hero-red .hero-header { background: var(--accent); color: #fff; }
        .hero-green .hero-header { background: var(--accent-green); color: #fff; }
        .hero-card .hero-title {
            font-size: 0.95rem; font-weight: 700; letter-spacing: 0.2px;
        }
        .hero-card .hero-body {
            padding: 16px 20px; display: flex; align-items: center; gap: 24px;
        }
        .hero-input {
            flex: 0 0 auto; min-width: 0; max-width: 480px;
        }
        .hero-input .input-label {
            font-size: 0.75rem; color: var(--text-muted); margin-bottom: 2px;
        }
        .hero-input .input-value {
            font-size: 0.88rem; color: var(--text); word-break: break-all;
            line-height: 1.5;
        }
        .hero-pred {
            flex: 0 0 auto; display: flex; flex-direction: column; align-items: center;
            gap: 4px;
        }
        .hero-pred .pred-label-hero {
            font-size: 1.1rem; font-weight: 700; padding: 4px 16px;
            border-radius: 6px;
        }
        .hero-red .pred-conf-hero { color: var(--accent); }
        .hero-green .pred-conf-hero { color: var(--accent-green); }
        .hero-pred .pred-conf-hero {
            font-size: 1.8rem; font-weight: 800;
        }
        .hero-pred .pred-time-hero {
            font-size: 0.75rem; color: var(--text-muted);
        }
        .hero-top3 {
            flex: 1; min-width: 0;
        }
        .hero-top3 .top3-title {
            font-size: 0.78rem; color: var(--text-muted); font-weight: 600; margin-bottom: 6px;
        }
        .hero-top3 .top3-row {
            display: flex; align-items: center; gap: 10px; padding: 3px 0;
        }
        .hero-top3 .top3-label {
            font-size: 0.82rem; font-weight: 500; white-space: nowrap; min-width: 80px;
        }
        .hero-top3 .top3-bar-bg {
            flex: 1; height: 8px; background: var(--bar-bg); border-radius: 4px; overflow: hidden;
        }
        .hero-red .top3-bar-fill { background: var(--accent); }
        .hero-green .top3-bar-fill { background: var(--accent-green); }
        .hero-top3 .top3-bar-fill {
            height: 100%; border-radius: 4px;
        }
        .hero-top3 .top3-val {
            font-size: 0.82rem; font-weight: 700; min-width: 42px; text-align: right;
        }

        /* ========== 对比表格卡片 ========== */
        .compare-card {
            background: var(--card); border: 1px solid var(--border);
            border-radius: var(--radius); overflow: hidden;
            box-shadow: 0 1px 2px rgba(0,0,0,0.03);
        }
        .compare-card-header {
            padding: 10px 16px; background: #f8fafc; border-bottom: 1px solid var(--border);
            font-size: 0.82rem; font-weight: 600; color: var(--primary);
            display: flex; align-items: center; gap: 8px;
        }
        .compare-card-header .idx {
            display: inline-block; background: var(--primary); color: #fff;
            font-size: 0.7rem; padding: 1px 8px; border-radius: 3px; font-weight: 600;
        }
        .compare-card-header .txt {
            color: var(--text); font-weight: 400; max-width: 540px;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .table-wrap { overflow-x: auto; }
        table {
            width: 100%; border-collapse: collapse; font-size: 0.83rem;
        }
        thead { background: #f8fafc; }
        th {
            padding: 8px 12px; text-align: left; font-weight: 600;
            color: var(--text-muted); font-size: 0.75rem; text-transform: uppercase;
            letter-spacing: 0.2px; border-bottom: 2px solid var(--border);
        }
        td {
            padding: 7px 12px; border-bottom: 1px solid #f1f5f9;
            vertical-align: middle;
        }
        .model-name { font-weight: 500; white-space: nowrap; }
        .label-badge {
            display: inline-block; padding: 1px 8px; border-radius: 4px;
            font-size: 0.78rem; font-weight: 600; white-space: nowrap;
        }
        .label-normal { background: #dcfce7; color: #166534; }
        .label-spam { background: #fee2e2; color: #991b1b; }

        .conf-cell { min-width: 130px; }
        .conf-wrap { display: flex; align-items: center; gap: 6px; }
        .conf-bar-bg {
            flex: 1; height: 7px; background: var(--bar-bg);
            border-radius: 3px; overflow: hidden; min-width: 50px;
        }
        .conf-bar-fill { height: 100%; border-radius: 3px; }
        .conf-high { background: #059669; }
        .conf-mid { background: #e67e22; }
        .conf-low { background: #94a3b8; }
        .conf-val { font-size: 0.8rem; font-weight: 600; min-width: 44px; text-align: right; }

        .time-cell { color: var(--text-muted); font-size: 0.78rem; white-space: nowrap; }

        .top3-td { position: relative; }
        .top3-trigger {
            color: var(--primary); cursor: pointer; font-size: 0.76rem;
            text-decoration: underline dotted; white-space: nowrap;
        }
        .top3-popup {
            display: none; position: absolute; background: #fff;
            border: 1px solid var(--border); border-radius: 8px;
            padding: 8px 12px; box-shadow: 0 4px 14px rgba(0,0,0,0.10);
            z-index: 10; min-width: 160px; font-size: 0.78rem;
        }
        .top3-popup .prob-item {
            display: flex; justify-content: space-between; gap: 10px; padding: 2px 0;
        }
        .top3-popup .prob-label { color: var(--text-muted); }
        .top3-popup .prob-val { font-weight: 600; }

        /* ========== 粒子特效 ========== */
        #particle-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 9999;
        }

        /* 响应式 */
        @media (max-width: 900px) {
            .app-shell { flex-direction: column; }
            .left-panel { width: 100%; min-width: 0; max-height: 50vh; }
            .right-panel { height: 50vh; }
        }
    </style>
</head>
<body>
    <canvas id="particle-canvas"></canvas>
    <div class="app-shell">
        <!-- ======= 左侧面板：输入区 ======= -->
        <div class="left-panel">
            <h1>垃圾文本分类系统</h1>
            <p class="subtitle">支持多模型预测</p>

            <form id="predict-form">
                <div class="form-group">
                    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
                        <label style="margin-bottom:0;">输入文本</label>
                        <button type="button" class="btn-sm" style="flex:0 0 auto;padding:2px 14px;font-size:0.78rem;" onclick="fetchRandom()">🎲 随机</button>
                    </div>
                    <textarea name="texts" id="input-textarea" placeholder="点击右侧「随机」按钮从数据集中抽取文本，或手动输入..."></textarea>
                </div>

                <div class="form-group">
                    <label>选择模型</label>
                    <div class="quick-actions">
                        <button type="button" class="btn-sm" onclick="toggleAll(true)">全选</button>
                        <button type="button" class="btn-sm" onclick="toggleAll(false)">全不选</button>
                    </div>
                    <div class="model-list">
                        {% for m in models %}
                        <div class="model-item selected {% if m.star %}hero-item{% endif %}"
                             data-key="{{ m.key }}"
                             data-star="{{ 'true' if m.star else 'false' }}"
                             onclick="toggleModel(this)">
                            <input type="checkbox" name="models" value="{{ m.key }}" checked>
                            <label>{{ m.display }}</label>
                            {% if m.star %}<span class="star-badge">★ 主模型</span>{% endif %}
                        </div>
                        {% endfor %}
                    </div>
                </div>

                <button type="submit" class="btn-primary" id="submit-btn">
                    预测
                </button>
                <div id="loading-bar">
                    <span class="spinner"></span> 模型加载中（首次约 60-90 秒）...
                </div>
            </form>
        </div>

        <!-- ======= 右侧面板：结果区 ======= -->
        <div class="right-panel" id="results-panel">
            <div class="right-empty" id="results-empty">
                在左侧输入文本并点击「预测」查看结果
            </div>
        </div>
    </div>

    <script>
        // ===================== 随机文本 =====================
        async function fetchRandom() {
            const ta = document.getElementById('input-textarea');
            const btn = event.target;
            btn.disabled = true;
            btn.textContent = '...';
            try {
                const resp = await fetch('/api/random-text');
                const data = await resp.json();
                ta.value = data.text;
            } catch (err) {
                ta.value = '随机获取失败: ' + err.message;
            } finally {
                btn.disabled = false;
                btn.textContent = '🎲 随机';
            }
        }

        // ===================== 模型选择交互 =====================
        function toggleModel(el) {
            const cb = el.querySelector('input[type="checkbox"]');
            cb.checked = !cb.checked;
            el.classList.toggle('selected', cb.checked);
        }
        function toggleAll(select) {
            document.querySelectorAll('.model-item').forEach(item => {
                const cb = item.querySelector('input[type="checkbox"]');
                cb.checked = select;
                item.classList.toggle('selected', select);
            });
        }

        // ===================== AJAX 提交 =====================
        document.getElementById('predict-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            const loading = document.getElementById('loading-bar');
            btn.disabled = true;
            loading.classList.add('visible');

            const formData = new FormData(this);

            try {
                const resp = await fetch('/api/predict', { method: 'POST', body: formData });
                const data = await resp.json();

                if (data.error) {
                    showError(data.error);
                } else if (data.results) {
                    renderResults(data.results);
                }
            } catch (err) {
                showError('网络请求失败: ' + err.message);
            } finally {
                btn.disabled = false;
                loading.classList.remove('visible');
            }
        });

        // ===================== 渲染结果 =====================
        function showError(msg) {
            const panel = document.getElementById('results-panel');
            panel.innerHTML = '<div class="error-box">' + escapeHtml(msg) + '</div>';
        }

        function renderResults(results) {
            const panel = document.getElementById('results-panel');
            const nModels = results[0] ? results[0].model_results.length : 0;

            let html = '<div class="result-summary">预测结果' +
                       '<span>' + results.length + ' 条文本 × ' + nModels + ' 个模型</span></div>';

            results.forEach(function(result) {
                // 找出 ensemble_cross 和其余模型
                const hero = result.model_results.find(function(m) {
                    return m.model_key === 'ensemble_cross' && !m.error;
                });
                const others = result.model_results.filter(function(m) {
                    return m.model_key !== 'ensemble_cross';
                });

                // hero 卡片
                if (hero) {
                    html += buildHeroCard(result, hero);
                }

                // 对比表格
                html += buildCompareCard(result, hero, others);
            });

            panel.innerHTML = html;
            panel.scrollTop = 0;
        }

        function buildHeroCard(result, hero) {
            const isNormal = hero.pred_label === 0;
            const labelClass = isNormal ? 'label-normal' : 'label-spam';
            const themeClass = isNormal ? 'hero-green' : 'hero-red';

            let top3html = '';
            hero.proba_list.forEach(function(p) {
                const pct = (p.prob * 100).toFixed(1);
                top3html += '<div class="top3-row">' +
                    '<span class="top3-label">' + p.label_name + '</span>' +
                    '<div class="top3-bar-bg"><div class="top3-bar-fill" style="width:' + pct + '%"></div></div>' +
                    '<span class="top3-val">' + pct + '%</span>' +
                    '</div>';
            });

            const confPct = (hero.confidence * 100).toFixed(1);
            const timeMs = hero.elapsed_ms;

            return '<div class="hero-card ' + themeClass + '">' +
                '<div class="hero-header">' +
                    '<span class="hero-title">★ ensemble_cross · 主模型</span>' +
                    '<span style="font-size:0.8rem;opacity:0.9">22模型加权融合</span>' +
                '</div>' +
                '<div class="hero-body">' +
                    '<div class="hero-input">' +
                        '<div class="input-label">输入文本</div>' +
                        '<div class="input-value">"' + escapeHtml(result.text) + '"</div>' +
                    '</div>' +
                    '<div class="hero-pred">' +
                        '<span class="pred-label-hero ' + labelClass + '">' + hero.label_name + '</span>' +
                        '<span class="pred-conf-hero">' + confPct + '%</span>' +
                        '<span class="pred-time-hero">' + timeMs + ' ms</span>' +
                    '</div>' +
                    '<div class="hero-top3">' +
                        '<div class="top3-title">Top-3 概率分布</div>' +
                        top3html +
                    '</div>' +
                '</div>' +
            '</div>';
        }

        function buildCompareCard(result, hero, others) {
            if (others.length === 0) return '';

            let rows = '';
            others.forEach(function(mr, idx) {
                if (mr.error) {
                    rows += '<tr><td><span class="model-name">' + mr.display_name + '</span></td>' +
                            '<td colspan="4" style="color:#b91c1c;font-size:0.78rem;">⚠ ' + escapeHtml(mr.error) + '</td></tr>';
                    return;
                }
                const isNormal = mr.pred_label === 0;
                const labelClass = isNormal ? 'label-normal' : 'label-spam';
                const confPct = (mr.confidence * 100).toFixed(1);
                const confBarClass = mr.confidence >= 0.8 ? 'conf-high' : (mr.confidence >= 0.5 ? 'conf-mid' : 'conf-low');

                rows += '<tr>' +
                    '<td><span class="model-name">' + mr.display_name + '</span></td>' +
                    '<td><code style="font-weight:600;">' + mr.pred_label + '</code></td>' +
                    '<td><span class="label-badge ' + labelClass + '">' + mr.label_name + '</span></td>' +
                    '<td class="conf-cell"><div class="conf-wrap">' +
                        '<div class="conf-bar-bg"><div class="conf-bar-fill ' + confBarClass + '" style="width:' + confPct + '%"></div></div>' +
                        '<span class="conf-val">' + confPct + '%</span>' +
                    '</div></td>' +
                    '<td class="top3-td">' +
                        '<span class="top3-trigger" onclick="toggleTop3(this)">查看 ▾</span>' +
                        '<div class="top3-popup">' + buildTop3Popup(mr) + '</div>' +
                    '</td>' +
                    '<td class="time-cell">' + mr.elapsed_ms + ' ms</td>' +
                '</tr>';
            });

            return '<div class="compare-card">' +
                '<div class="compare-card-header">非主模型预测结果</div>' +
                '<div class="table-wrap">' +
                    '<table><thead><tr>' +
                        '<th>模型</th><th>类别</th><th>标签</th><th>置信度</th><th>Top-3</th><th>耗时</th>' +
                    '</tr></thead><tbody>' + rows + '</tbody></table>' +
                '</div>' +
            '</div>';
        }

        function buildTop3Popup(mr) {
            let html = '';
            mr.proba_list.forEach(function(p) {
                html += '<div class="prob-item">' +
                    '<span class="prob-label">' + p.label_name + '</span>' +
                    '<span class="prob-val">' + (p.prob * 100).toFixed(1) + '%</span>' +
                '</div>';
            });
            return html;
        }

        function toggleTop3(el) {
            var popup = el.nextElementSibling;
            document.querySelectorAll('.top3-popup').forEach(function(p) {
                if (p !== popup) p.style.display = 'none';
            });
            popup.style.display = popup.style.display === 'block' ? 'none' : 'block';
        }

        function escapeHtml(str) {
            var div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // 点击空白关闭弹窗
        document.addEventListener('click', function(e) {
            if (!e.target.closest('.top3-td')) {
                document.querySelectorAll('.top3-popup').forEach(function(p) {
                    p.style.display = 'none';
                });
            }
        });
        // ===================== 点击粒子特效 =====================
        (function initParticles() {
            const canvas = document.getElementById('particle-canvas');
            const ctx = canvas.getContext('2d');
            let particles = [];
            let animating = false;

            function resize() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resize);
            resize();

            class Particle {
                constructor(x, y) {
                    this.x = x;
                    this.y = y;
                    const angle = Math.random() * Math.PI * 2;
                    const speed = 2 + Math.random() * 6;
                    this.vx = Math.cos(angle) * speed;
                    this.vy = Math.sin(angle) * speed;
                    this.radius = 2 + Math.random() * 5;
                    this.life = 1.0;
                    this.decay = 0.012 + Math.random() * 0.025;
                    this.color = HSL_TO_RGB(Math.random() * 360, 80, 55 + Math.random() * 30);
                }

                update() {
                    this.x += this.vx;
                    this.y += this.vy;
                    this.vy += 0.08;
                    this.vx *= 0.99;
                    this.life -= this.decay;
                    this.radius *= 0.995;
                }

                draw(ctx) {
                    if (this.life <= 0) return;
                    ctx.save();
                    ctx.globalAlpha = this.life;
                    ctx.fillStyle = this.color;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, Math.max(this.radius, 0.5), 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }

                get dead() { return this.life <= 0; }
            }

            function HSL_TO_RGB(h, s, l) {
                h /= 360; s /= 100; l /= 100;
                const a = s * Math.min(l, 1 - l);
                const f = (n) => {
                    const k = (n + h * 12) % 12;
                    return l - a * Math.max(-1, Math.min(k - 3, Math.min(9 - k, 1)));
                };
                const r = Math.round(f(0) * 255);
                const g = Math.round(f(8) * 255);
                const b = Math.round(f(4) * 255);
                return 'rgb(' + r + ',' + g + ',' + b + ')';
            }

            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                particles = particles.filter(function(p) { return !p.dead; });

                for (var i = 0; i < particles.length; i++) {
                    particles[i].update();
                    particles[i].draw(ctx);
                }

                if (particles.length > 0) {
                    requestAnimationFrame(animate);
                } else {
                    animating = false;
                }
            }

            function burst(x, y, count) {
                for (var i = 0; i < count; i++) {
                    particles.push(new Particle(x, y));
                }
                if (!animating) {
                    animating = true;
                    requestAnimationFrame(animate);
                }
            }

            document.addEventListener('click', function(e) {
                burst(e.clientX, e.clientY, 25);
            });
        })();
    </script>
</body>
</html>
